<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>情绪空间 · 高敏感人群情绪疏导</title>
  <link rel="stylesheet" href="style.css?v=20261025">
</head>
<body>
  <!-- 背景：油画风白蓝幕布（上白下蓝自然过渡，带油画颗粒）；透明底蝴蝶素材待接入 -->
  <div class="bg-photo" aria-hidden="true"></div>

  <!-- 左侧：背景音乐选择面板（蓝白调，圆形按键） -->
  <aside class="bgm-panel" id="bgmPanel" aria-label="背景音乐">
    <div class="bgm-title">背景音乐</div>
    <div class="bgm-list" id="bgmList"></div>
  </aside>

  <div class="app">
    <header class="header">
      <h1>情绪空间</h1>
      <p class="subtitle">一个给高敏感人群的安全角落</p>
      <div class="header-actions" id="headerActions">
        <button id="historyBtn" class="header-btn hidden" title="查看最近 30 天的对话记录">历史</button>
        <button id="newConvBtn" class="header-btn hidden" title="开始一段新的对话">新对话</button>
        <span id="userNick" class="user-nick hidden"></span>
        <button id="authBtn" class="header-btn">登录 / 注册</button>
        <button id="logoutBtn" class="header-btn hidden">退出</button>
      </div>
    </header>

    <div class="auth-banner hidden" id="authBanner">
      <span>登录后可以保留对话与记忆，换设备也能继续。</span>
      <button id="bannerAuthBtn" class="header-btn">登录 / 注册</button>
      <button class="banner-close" id="bannerClose" title="知道了">×</button>
    </div>

    <main class="chat-container" id="chatContainer">
      <div class="message bot">
        <div class="bubble">嗨，欢迎来到情绪空间。你现在感觉怎么样？可以用一句话说说此刻最强烈的情绪。</div>
      </div>
    </main>

    <div class="crisis-banner hidden" id="crisisBanner">
      <strong>你并不孤单。</strong> 如果你现在处于危机中，请联系：
      <span id="crisisNumbers"></span>
    </div>

    <div class="input-area">
      <div class="options" id="options"></div>
      <div class="text-input-row">
        <button id="micBtn" class="icon-btn" title="语音输入">🎤</button>
        <input type="text" id="userInput" placeholder="输入你想说的话..." autocomplete="off">
        <button id="sendBtn">发送</button>
      </div>
    </div>
  </div>

  <!-- 登录/注册弹层 -->
  <div class="modal-mask hidden" id="authModal">
    <div class="modal-card" role="dialog" aria-label="登录或注册">
      <div class="modal-tabs">
        <button class="modal-tab active" id="tabLogin" type="button">登录</button>
        <button class="modal-tab" id="tabRegister" type="button">注册</button>
      </div>
      <form id="authForm" novalidate>
        <label class="form-field">
          <span>用户名</span>
          <input type="text" id="authUsername" maxlength="20" autocomplete="username" placeholder="3-20 位字母、数字或下划线">
        </label>
        <label class="form-field" id="nicknameField" style="display:none">
          <span>昵称（选填）</span>
          <input type="text" id="authNickname" maxlength="20" placeholder="怎么称呼你">
        </label>
        <label class="form-field">
          <span>密码</span>
          <input type="password" id="authPassword" maxlength="64" autocomplete="current-password" placeholder="6-64 位">
        </label>
        <div class="form-error hidden" id="authError"></div>
        <button type="submit" class="form-submit" id="authSubmit">登录</button>
      </form>
    </div>
  </div>

  <!-- 历史会话列表弹层 -->
  <div class="modal-mask hidden" id="historyPanel">
    <div class="modal-card" role="dialog" aria-label="历史会话">
      <div class="modal-title-row">
        <span class="modal-title">最近 30 天的对话</span>
        <button class="banner-close" id="historyClose" title="关闭">×</button>
      </div>
      <div class="history-list" id="historyList"></div>
    </div>
  </div>

  <script src="app.js?v=20261025"></script>
</body>
</html>
