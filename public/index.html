<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>情绪空间 · 高敏感人群情绪疏导</title>
  <link rel="stylesheet" href="style.css?v=20261027">
</head>
<body>
  <!-- 背景：油画风白蓝幕布（上白下蓝自然过渡，带油画颗粒）；透明底蝴蝶素材待接入 -->
  <div class="bg-photo" aria-hidden="true"></div>

  <!-- 左侧：背景音乐选择面板（蓝白调，圆形按键） -->
  <aside class="bgm-panel" id="bgmPanel" aria-label="背景音乐">
    <div class="bgm-title">背景音乐</div>
    <div class="bgm-list" id="bgmList"></div>
  </aside>

  <div class="app">
    <header class="header">
      <h1>情绪空间</h1>
      <p class="subtitle">一个给高敏感人群的安全角落</p>
    </header>

    <div class="auth-banner hidden" id="authBanner">
      <span>登录后可以保留对话与记忆，换设备也能继续。</span>
      <button id="bannerAuthBtn" class="header-btn">登录 / 注册</button>
      <button class="banner-close" id="bannerClose" title="知道了">×</button>
    </div>

    <main class="chat-container" id="chatContainer">
      <div class="message bot">
        <div class="bubble">嗨，欢迎来到情绪空间。你现在感觉怎么样？可以用一句话说说此刻最强烈的情绪。</div>
      </div>
    </main>

    <div class="crisis-banner hidden" id="crisisBanner">
      <strong>你并不孤单。</strong> 如果你现在处于危机中，请联系：
      <span id="crisisNumbers"></span>
    </div>

    <div class="input-area">
      <div class="options" id="options"></div>
      <div class="text-input-row">
        <button id="micBtn" class="icon-btn" title="语音输入">🎤</button>
        <input type="text" id="userInput" placeholder="输入你想说的话..." autocomplete="off">
        <button id="sendBtn">发送</button>
      </div>
    </div>
  </div>

  <!-- 右上角：账号动物头像，点击展开账号菜单 -->
  <div class="account-area">
    <button id="avatarBtn" class="avatar-btn" title="账号">🐾</button>
    <div class="account-menu hidden" id="accountMenu" role="menu"></div>
  </div>

  <!-- 手机号验证码登录弹层 -->
  <div class="modal-mask hidden" id="loginModal">
    <div class="modal-card" role="dialog" aria-label="手机号登录">
      <div class="modal-title-row">
        <span class="modal-title">手机号登录</span>
        <button class="banner-close" id="loginClose" title="关闭">×</button>
      </div>
      <p class="modal-sub">首次登录将自动为你创建账号</p>
      <div class="channel-tabs">
        <button type="button" class="channel-tab active" id="tabSms">手机号</button>
        <button type="button" class="channel-tab" id="tabEmail">邮箱</button>
      </div>
      <form id="loginForm" novalidate>
        <label class="form-field">
          <span id="targetLabel">手机号</span>
          <input type="text" id="targetInput" maxlength="100" autocomplete="username" placeholder="请输入 11 位手机号">
        </label>
        <label class="form-field">
          <span>验证码</span>
          <div class="code-row">
            <input type="text" id="codeInput" maxlength="6" inputmode="numeric" autocomplete="one-time-code" placeholder="6 位验证码">
            <button type="button" class="code-btn" id="sendCodeBtn">获取验证码</button>
          </div>
        </label>
        <div class="form-error hidden" id="loginError"></div>
        <div class="dev-hint hidden" id="devHint"></div>
        <button type="submit" class="form-submit" id="loginSubmit">登录</button>
      </form>
    </div>
  </div>

  <!-- 个人中心弹层 -->
  <div class="modal-mask hidden" id="profileModal">
    <div class="modal-card" role="dialog" aria-label="个人中心">
      <div class="modal-title-row">
        <span class="modal-title">个人中心</span>
        <button class="banner-close" id="profileClose" title="关闭">×</button>
      </div>
      <div class="profile-phone" id="profilePhone"></div>
      <div class="form-field">
        <span>选一个动物头像</span>
        <div class="avatar-grid" id="avatarGrid"></div>
      </div>
      <label class="form-field">
        <span>昵称（选填）</span>
        <input type="text" id="profileNickname" maxlength="20" placeholder="怎么称呼你">
      </label>
      <div class="form-error hidden" id="profileError"></div>
      <button type="button" class="form-submit" id="profileSave">保存</button>
    </div>
  </div>

  <!-- 历史会话列表弹层（对话管理） -->
  <div class="modal-mask hidden" id="historyPanel">
    <div class="modal-card" role="dialog" aria-label="对话管理">
      <div class="modal-title-row">
        <span class="modal-title">最近 30 天的对话</span>
        <button class="banner-close" id="historyClose" title="关闭">×</button>
      </div>
      <div class="history-list" id="historyList"></div>
    </div>
  </div>

  <script src="app.js?v=20261027"></script>
</body>
</html>
